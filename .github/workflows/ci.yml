name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hetzner-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate private deployment bootstrap
        run: |
          bash -n deploy/hetzner/initialize-secrets.sh
          sudo bash deploy/hetzner/initialize-secrets-paths.test.sh
          sudo bash deploy/hetzner/initialize-secrets.test.sh

  build-and-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      JWT_SECRET: ci-session-signing-secret-at-least-32-characters
      VITE_APP_ID: ci-placeholder-app
      OAUTH_SERVER_URL: http://localhost:3000
      OAUTH_PORTAL_URL: http://localhost:3001
      OWNER_OPEN_ID: test-user-1
      BUILT_IN_FORGE_API_KEY: ci-placeholder-forge-key

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Run tests
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-output
          path: test-output.log

      - name: Build
        run: pnpm build

  windows-runtime:
    runs-on: windows-latest
    env:
      NODE_ENV: test
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      JWT_SECRET: ci-session-signing-secret-at-least-32-characters
      VITE_APP_ID: ci-placeholder-app
      OAUTH_SERVER_URL: http://localhost:3000
      OAUTH_PORTAL_URL: http://localhost:3001
      OWNER_OPEN_ID: test-user-1
      BUILT_IN_FORGE_API_KEY: ci-placeholder-forge-key

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Enable pnpm with Corepack
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit moderate, high, and critical dependency vulnerabilities
        run: pnpm security:audit

      - name: Type check
        run: pnpm check

      - name: Validate Windows launchers
        shell: pwsh
        run: ./scripts/check-windows-runtime.ps1

      - name: Test Windows and HAI runtime contracts
        run: pnpm exec vitest run server/_core/network.test.ts server/haiConnector.test.ts server/windowsCiWorkflow.test.ts server/windowsLauncher.test.ts server/_core/runtimeInstance.test.ts server/_core/runtimeLaunchIdentity.test.ts

      - name: Build
        run: pnpm build

  database-acceptance:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_DATABASE: hire_ai_acceptance
          MYSQL_USER: hire_ai_acceptance
          MYSQL_PASSWORD: isolated-acceptance-not-production
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=30
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://hire_ai_acceptance:isolated-acceptance-not-production@127.0.0.1:3306/hire_ai_acceptance
      HIRE_AI_DATABASE_ACCEPTANCE: "true"
      HIRE_AI_DATABASE_ACCEPTANCE_REPORT: database-acceptance-report.json
      PRIVACY_ERASURE_INTEGRATION: "true"
      AUTONOMOUS_SCHEDULER_ENABLED: "false"
      JOB_SCRAPING_SCHEDULER_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations to isolated acceptance database
        run: pnpm db:migrate
      - name: Verify persistence, isolation and privacy cleanup on MySQL
        run: |
          set -o pipefail
          pnpm test:database 2>&1 | tee database-acceptance.log

      - name: Upload database acceptance evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: database-acceptance-evidence
          path: |
            database-acceptance.log
            database-acceptance-report.json
          if-no-files-found: warn

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_DATABASE: hire_ai_e2e
          MYSQL_USER: hire_ai_e2e
          MYSQL_PASSWORD: isolated-e2e-not-production
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=30
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://hire_ai_e2e:isolated-e2e-not-production@127.0.0.1:3306/hire_ai_e2e
      AUTONOMOUS_SCHEDULER_ENABLED: "false"
      JOB_SCRAPING_SCHEDULER_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install headless Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Run authenticated browser smoke tests
        run: pnpm test:e2e
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

  container-runtime:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci-password
          MYSQL_DATABASE: hire_ai
          MYSQL_USER: hire_ai
          MYSQL_PASSWORD: hire-ai-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=root-ci-password"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build -t hire-ai:ci .

      - name: Verify fail-closed startup
        run: |
          if docker run --rm hire-ai:ci; then
            echo "Container started without required production configuration."
            exit 1
          fi

      - name: Apply complete migration history from the image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL='mysql://hire_ai:hire-ai-ci-password@127.0.0.1:3306/hire_ai' \
            --entrypoint node hire-ai:ci scripts/database-migrate.mjs

      - name: Verify migrated schema matches the runtime model
        run: |
          docker run --rm --network host \
            -e DATABASE_URL='mysql://hire_ai:hire-ai-ci-password@127.0.0.1:3306/hire_ai' \
            --entrypoint node hire-ai:ci dist/database-schema-audit.js

      - name: Verify representative production query plans
        run: |
          docker run --rm --network host \
            -e DATABASE_URL='mysql://hire_ai:hire-ai-ci-password@127.0.0.1:3306/hire_ai' \
            --entrypoint node hire-ai:ci dist/database-query-plan-audit.js

      - name: Verify production health and readiness
        run: |
          trap 'docker rm -f hire-ai-ci-app >/dev/null 2>&1 || true' EXIT
          docker run -d --name hire-ai-ci-app --network host \
            -e PORT=33050 \
            -e DATABASE_URL='mysql://hire_ai:hire-ai-ci-password@127.0.0.1:3306/hire_ai' \
            -e JWT_SECRET='container-ci-jwt-secret-at-least-32-characters' \
            -e ERASURE_IDENTITY_HMAC_KEYS='container-ci-erasure-identity-hmac-key-at-least-32-characters' \
            -e VITE_APP_ID='hire-ai-container-ci' \
            -e OAUTH_SERVER_URL='https://oauth.example.test' \
            -e OAUTH_SERVER_ALLOWED_ORIGINS='https://oauth.example.test' \
            -e OAUTH_PORTAL_URL='https://auth.example.test' \
            -e OWNER_OPEN_ID='container-ci-owner' \
            -e BUILT_IN_FORGE_API_KEY='container-ci-forge-key' \
            -e STRIPE_SECRET_KEY='sk_test_container_ci' \
            -e STRIPE_WEBHOOK_SECRET='whsec_container_ci' \
            -e FILE_MALWARE_SCAN_MODE='http' \
            -e FILE_MALWARE_SCAN_URL='http://127.0.0.1:39999/scan' \
            -e FILE_MALWARE_SCAN_ALLOWED_ORIGINS='http://127.0.0.1:39999' \
            -e AUTONOMOUS_SCHEDULER_ENABLED=false \
            -e JOB_SCRAPING_SCHEDULER_ENABLED=false \
            hire-ai:ci
          for attempt in $(seq 1 45); do
            state=$(docker inspect hire-ai-ci-app --format '{{.State.Status}}/{{.State.Health.Status}}')
            if [ "$state" = 'running/healthy' ] \
              && curl --fail --silent http://127.0.0.1:33050/healthz | grep -q '"status":"ok"' \
              && curl --fail --silent http://127.0.0.1:33050/readyz | grep -q '"ready":true' \
              && curl --fail --silent http://127.0.0.1:33050/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs hire-ai-ci-app
          exit 1
